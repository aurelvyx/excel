<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 220" width="550" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Excel Language Center</title>
  <desc id="desc">Globo terráqueo verde junto al nombre Excel Language Center</desc>
  <defs>
    <style>
      .excel-main { font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 135px; fill: #008a3c; font-style: italic; }
      .excel-sub { font-family: "Montserrat", "Arial Black", Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #008a3c; letter-spacing: .8px; }
      .excel-reg { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #008a3c; }
    </style>
    <clipPath id="globe-clip"><circle cx="105" cy="110" r="68" /></clipPath>
  </defs>
  <g id="globe">
    <circle cx="105" cy="110" r="74" fill="none" stroke="#008a3c" stroke-width="4.5" />
    <g clip-path="url(#globe-clip)">
      <rect x="30" y="35" width="75" height="150" fill="#007532" />
      <rect x="105" y="35" width="75" height="150" fill="#009640" />
      <g fill="none" stroke="#fff" stroke-width="3.5">
        <line x1="105" y1="35" x2="105" y2="185" />
        <ellipse cx="105" cy="110" rx="28" ry="69" />
        <ellipse cx="105" cy="110" rx="55" ry="69" />
        <line x1="30" y1="93" x2="180" y2="93" />
        <line x1="30" y1="127" x2="180" y2="127" />
        <path d="M 35 62 Q 105 72 175 62" />
        <path d="M 35 158 Q 105 148 175 158" />
        <ellipse cx="105" cy="39" rx="18" ry="8" fill="#008a3c" />
        <ellipse cx="105" cy="181" rx="18" ry="8" fill="#008a3c" />
      </g>
    </g>
  </g>
  <text x="195" y="138" class="excel-main" transform="rotate(-4, 290, 115)">Excel</text>
  <text x="488" y="55" class="excel-reg">®</text>
  <text x="368" y="158" class="excel-sub">LANGUAGE</text>
  <text x="412" y="180" class="excel-sub">CENTER</text>
</svg>
