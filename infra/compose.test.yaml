services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: excel_test
      POSTGRES_USER: excel_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Password efímero requerido}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_test -d excel_test"]
      interval: 2s
      timeout: 3s
      retries: 30
