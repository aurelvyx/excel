name: Verificación B01–B10
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter api exec playwright install --with-deps chromium
      - run: pnpm test:db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-tecnica
          path: |
            .tmp/verificacion/pruebas.json
            .tmp/b09/*.png
            .tmp/b10/*.png
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
